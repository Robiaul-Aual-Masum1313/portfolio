<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Glowing circle background -->
  <circle cx="200" cy="180" r="130" stroke="url(#neonGlow)" stroke-width="4" opacity="0.6" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="115" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie / Shoulders -->
  <path d="M100 370 C100 290 140 260 200 260 C260 260 300 290 300 370 Z" fill="url(#hoodieGrad)"/>
  
  <!-- Inner shirt collar -->
  <polygon points="180,260 220,260 200,295" fill="#090d16"/>
  <circle cx="200" cy="275" r="4" fill="#06b6d4"/>

  <!-- Neck -->
  <rect x="185" y="220" width="30" height="45" rx="6" fill="#fbcfe8"/>

  <!-- Head / Face -->
  <rect x="150" y="125" width="100" height="110" rx="36" fill="#fed7aa"/>

  <!-- Hair Modern Cut -->
  <path d="M145 145 C145 100 170 85 200 85 C235 85 255 100 255 145 C250 120 230 110 200 110 C170 110 150 120 145 145 Z" fill="#1e293b"/>
  <path d="M142 140 C140 160 145 175 148 180 C150 165 148 150 150 140 Z" fill="#1e293b"/>
  <path d="M258 140 C260 160 255 175 252 180 C250 165 252 150 250 140 Z" fill="#1e293b"/>

  <!-- Stylish Glasses (Developer look) -->
  <!-- Left frame -->
  <rect x="160" y="152" width="32" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="3.5"/>
  <!-- Right frame -->
  <rect x="208" y="152" width="32" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="3.5"/>
  <!-- Bridge -->
  <line x1="192" y1="162" x2="208" y2="162" stroke="#6366f1" stroke-width="3.5"/>
  <!-- Lens reflection -->
  <line x1="164" y1="156" x2="175" y2="167" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="212" y1="156" x2="223" y2="167" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Eyes behind glasses -->
  <circle cx="176" cy="164" r="3" fill="#0f172a"/>
  <circle cx="224" cy="164" r="3" fill="#0f172a"/>

  <!-- Nose -->
  <path d="M200 175 L196 186 L204 186" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Friendly Smile -->
  <path d="M188 200 Q200 212 212 200" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Floating Coding Particles / Tech Symbols -->
  <g opacity="0.85">
    <!-- Code tag left -->
    <rect x="40" y="130" width="55" height="34" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="67" y="152" fill="#818cf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

    <!-- React atom symbol right -->
    <rect x="305" y="140" width="55" height="34" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="332" y="162" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">⚛</text>

    <!-- Star bottom left -->
    <rect x="55" y="250" width="50" height="30" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="270" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MERN</text>

    <!-- Lightning bottom right -->
    <rect x="295" y="260" width="50" height="30" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="320" y="280" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⚡ JS</text>
  </g>
</svg>

